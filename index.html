<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Globe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="globe"></canvas>
    <div id="search">
      <input
        id="q"
        type="text"
        placeholder="Search country…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        role="combobox"
        aria-expanded="false"
        aria-controls="results"
        aria-autocomplete="list"
        aria-label="Search for a country"
      />
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <aside id="info" class="hidden" aria-label="Country information">
      <header class="info-head">
        <img id="info-flag" alt="" hidden />
        <div class="info-title">
          <h2 id="info-name"></h2>
          <p id="info-sub"></p>
        </div>
      </header>
      <section class="info-pop">
        <div class="k live">Population <span class="badge">LIVE</span></div>
        <div id="info-pop" class="big">—</div>
        <div id="info-popsub" class="s"></div>
      </section>
      <div id="info-grid" class="grid"></div>
      <p class="foot">
        REST Countries · World Bank · Open-Meteo · USGS. Population, births and
        deaths are running estimates.
      </p>
    </aside>
    <button id="theme" aria-label="Toggle theme" title="Toggle theme">
      <svg
        class="sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
      <svg
        class="moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
    <script>
      if (location.protocol === "file:") {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;font:16px system-ui,sans-serif;color:#888">Browsers block loading data from file:// pages.<br>Open with start.bat or VS Code Live Server instead.</p>',
        );
      }
    </script>
    <script src="lib/d3.min.js"></script>
    <script src="lib/topojson.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
